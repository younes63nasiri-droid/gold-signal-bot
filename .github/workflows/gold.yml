name: Gold Signal Bot

on:
  push:
    branches: [main]
    paths-ignore:
      - "paper_trades_state.json"
      - "gold_signal_state.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping 15-minute runs from racing on shared signal state.
concurrency:
  group: gold-signal-bot-main
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Check Python syntax
        run: python -m py_compile gold2.py market_scanner.py risk_manager.py paper_trader.py paper_ledger.py

      - name: Run risk manager tests
        run: python -m unittest discover -s tests -v

      - name: Run gold signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ORDER_MARGIN_USDT: "0.50"
        run: python gold2.py
