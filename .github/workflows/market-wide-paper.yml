name: Market Wide Paper Scanner

on:
  push:
    branches: [market-wide-paper-scanner]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-wide-paper-scanner
  cancel-in-progress: false

jobs:
  scan-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated paper branch
        uses: actions/checkout@v4
        with:
          ref: market-wide-paper-scanner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Check Python syntax
        run: python -m py_compile market_scanner.py market_wide_paper.py

      - name: Scan all Toobit USDT perpetuals and paper trade
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GOLD_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GOLD_TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python market_wide_paper.py
