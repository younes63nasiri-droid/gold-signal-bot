name: VIVA AI Sports Scanner

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viva-ai-sports
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout VIVA branch
        uses: actions/checkout@v4
        with:
          ref: viva-ai-sports
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Scan fixtures and send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.VIVA_AI_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.VIVA_TELEGRAM_CHAT_ID }}
        run: python sports_bot/scanner.py
