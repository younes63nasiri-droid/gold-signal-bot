name: VIVA AI Sports Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - viva-ai-sports

permissions:
  contents: write

concurrency:
  group: viva-ai-sports
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VIVA branch
        uses: actions/checkout@v4
        with:
          ref: viva-ai-sports
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Validate scanner syntax
        run: python -m py_compile sports_bot/scanner.py

  scan:
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated VIVA branch
        uses: actions/checkout@v4
        with:
          ref: viva-ai-sports
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Validate scanner
        run: python -m py_compile sports_bot/scanner.py
      - name: Scan and send only new picks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '601146458' }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSLINK_API_KEY: ${{ secrets.ODDSLINK_API_KEY }}
          UK_ODDS_API_KEY: ${{ secrets.UK_ODDS_API_KEY }}
        run: python sports_bot/scanner.py
      - name: Save sent-pick history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports_bot/viva_sent.json
          if ! git diff --cached --quiet; then
            git commit -m "Record VIVA picks already sent"
            git push origin HEAD:viva-ai-sports
          fi
