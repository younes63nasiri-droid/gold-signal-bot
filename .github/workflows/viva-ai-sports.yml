name: VIVA AI Sports Scanner

on:
  schedule:
    # 22:00 Asia/Tehran (UTC+3:30) = 18:30 UTC
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viva-ai-sports
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated VIVA branch
        uses: actions/checkout@v4
        with:
          ref: viva-ai-sports
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Validate scanner
        run: python -m py_compile sports_bot/scanner.py
      - name: Scan tomorrow's permitted fixtures
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python sports_bot/scanner.py
